{% extends "base.html" %}

{% block content %}
<div class="container" style="max-width: 800px;">
  <h1>Alerts</h1>
  {% for n in notifications %}
    <div class="card mb-2 {% if not n.is_read %}border-danger{% endif %}">
      <div class="card-body d-flex justify-content-between align-items-center gap-3">
        <div>
          {% if not n.is_read %}<span class="badge bg-danger">New</span>{% endif %}
          {{ n.message }}
          <div class="text-muted small">{{ n.created_at|timesince }} ago</div>
        </div>
        {% if n.link %}<a class="btn btn-outline-danger btn-sm" href="{{ n.link }}">View</a>{% endif %}
      </div>
    </div>
  {% empty %}
    <p>No alerts yet.</p>
  {% endfor %}
</div>
{% endblock %}
