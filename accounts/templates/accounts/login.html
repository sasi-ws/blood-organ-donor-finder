{% extends "base.html" %}
{% block title %}Log in | Donor Finder{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <h1 class="h3 fw-bold text-center">Welcome back</h1>
    <p class="text-muted text-center">Log in to manage your profile and requests.</p>

    <form method="post" class="card card-body">
      {% csrf_token %}
      {{ form.non_field_errors }}
      <div class="mb-3">
        <label class="form-label fw-semibold" for="id_username">Username</label>
        <input type="text" name="username" id="id_username" class="form-control" autofocus required>
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold" for="id_password">Password</label>
        <input type="password" name="password" id="id_password" class="form-control" required>
      </div>
      <input type="hidden" name="next" value="{{ next }}">
      <div class="text-end mb-3">
        <a href="{% url 'accounts:password_reset' %}" class="text-brand small fw-semibold">Forgot password?</a>
      </div>
      <button type="submit" class="btn btn-brand w-100">Log in</button>
    </form>

    <p class="mt-3 text-center">
      New here?
      <a href="{% url 'accounts:register' %}?role=donor" class="text-brand fw-semibold">Register as a donor</a> or
      <a href="{% url 'accounts:register' %}?role=seeker" class="text-brand fw-semibold">as a seeker</a>
    </p>
  </div>
</div>
{% endblock %}
